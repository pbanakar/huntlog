services:
  postgres:
    image: postgres:16-alpine
    container_name: huntlog-postgres
    environment:
      POSTGRES_DB: huntlog
      POSTGRES_USER: huntlog
      POSTGRES_PASSWORD: huntlog
    ports:
      - "5432:5432"
    volumes:
      - huntlog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huntlog -d huntlog"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: huntlog-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/huntlog
      DB_USER: huntlog
      DB_PASS: huntlog
      # Mailtrap SMTP Configuration for local testing
      # To get free credentials: Sign up at mailtrap.io -> Inboxes -> Email Testing -> SMTP Settings
      MAIL_HOST: sandbox.smtp.mailtrap.io
      MAIL_PORT: 2525
      MAIL_USERNAME: ${MAILTRAP_USERNAME:-}
      MAIL_PASSWORD: ${MAILTRAP_PASSWORD:-}
      REMINDERS_ENABLED: "true"
      REMINDER_STALE_DAYS: "7"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  huntlog-postgres-data:
