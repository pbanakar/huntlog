spring:
  datasource:
    url: ${DATABASE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:5432}}/${DB_NAME:${PGDATABASE:${POSTGRES_DB:huntlog}}}}}
    username: ${DB_USER:${DB_USERNAME:${PGUSER:${POSTGRES_USER:huntlog}}}}
    password: ${DB_PASS:${DB_PASSWORD:${PGPASSWORD:${POSTGRES_PASSWORD:huntlog}}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@huntlog.com}}
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-minimum-256-bits-long-change-in-production-environment}
    expiration-ms: 86400000  # 24 hours
  security:
    auth-rate-limit:
      max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  reminders:
    stale-days: ${REMINDER_STALE_DAYS:7}
    enabled: ${REMINDERS_ENABLED:true}
    scan-interval-ms: ${REMINDER_SCAN_INTERVAL_MS:3600000}
    initial-delay-ms: ${REMINDER_INITIAL_DELAY_MS:60000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
