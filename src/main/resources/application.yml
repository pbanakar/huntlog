spring:
  datasource:
    url: ${DATABASE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:5432}}/${DB_NAME:${PGDATABASE:${POSTGRES_DB:huntlog}}}}}
    username: ${DB_USER:${DB_USERNAME:${PGUSER:${POSTGRES_USER:huntlog}}}}
    password: ${DB_PASS:${DB_PASSWORD:${PGPASSWORD:${POSTGRES_PASSWORD:huntlog}}}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-minimum-256-bits-long-change-in-production-environment}
    expiration-ms: 86400000  # 24 hours
  reminders:
    stale-days: ${REMINDER_STALE_DAYS:7}
    enabled: ${REMINDERS_ENABLED:true}
    cron: ${REMINDER_CRON:0 0 9 * * *}
