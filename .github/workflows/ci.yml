name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: huntlog
          MYSQL_USER: huntlog
          MYSQL_PASSWORD: huntlog
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u huntlog -phuntlog"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: mvn verify -B
        env:
          DB_URL: jdbc:mysql://localhost:3306/huntlog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          DB_USER: huntlog
          DB_PASS: huntlog
