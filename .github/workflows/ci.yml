name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: huntlog
          POSTGRES_USER: huntlog
          POSTGRES_PASSWORD: huntlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U huntlog -d huntlog"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: mvn verify -B
        env:
          DB_URL: jdbc:postgresql://localhost:5432/huntlog
          DB_USER: huntlog
          DB_PASS: huntlog
